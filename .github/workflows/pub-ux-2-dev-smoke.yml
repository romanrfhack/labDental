name: Smoke DEV PUB-UX-2

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: pub-ux-2-dev-smoke
  cancel-in-progress: true

jobs:
  smoke-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for DEV and validate rendered public catalog
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE_URL="https://dev.laboratoriodentaltlahuac.com"
          REPORT="$RUNNER_TEMP/pub-ux-2-dev-smoke.txt"
          WORK_DIR="$RUNNER_TEMP/pub-ux-2-smoke"
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          mkdir -p "$WORK_DIR"
          : > "$REPORT"

          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium is required for rendered DOM validation.' | tee -a "$REPORT"
            exit 1
          fi

          for attempt in $(seq 1 20); do
            echo "Attempt ${attempt}/20" | tee -a "$REPORT"

            health_code="$(curl -sS -L --connect-timeout 3 --max-time 12 -o "$WORK_DIR/health.txt" -w '%{http_code}' "$BASE_URL/health" || true)"
            catalog_code="$(curl -sS -L --connect-timeout 3 --max-time 15 -o "$WORK_DIR/catalog.html" -w '%{http_code}' "$BASE_URL/catalogo" || true)"
            api_code="$(curl -sS -L --connect-timeout 3 --max-time 15 -o "$WORK_DIR/catalog.json" -w '%{http_code}' "$BASE_URL/api/catalog/public" || true)"

            printf 'health=%s catalog=%s api=%s\n' "$health_code" "$catalog_code" "$api_code" | tee -a "$REPORT"

            api_valid="false"
            dom_valid="false"

            if [ "$api_code" = "200" ]; then
              if python3 - "$WORK_DIR/catalog.json" >> "$REPORT" 2>&1 <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          sections = payload.get('sections')
          assert isinstance(sections, list) and sections, 'sections must be a non-empty list'
          product_count = 0
          for section in sections:
              assert isinstance(section.get('key'), str) and section['key'].strip(), 'invalid section key'
              assert isinstance(section.get('name'), str) and section['name'].strip(), 'invalid section name'
              products = section.get('products')
              assert isinstance(products, list), 'section products must be a list'
              product_count += len(products)
          assert product_count > 0, 'catalog must contain products'
          print(f'api_sections={len(sections)} api_products={product_count}')
          PY
              then
                api_valid="true"
              fi
            fi

            if [ "$health_code" = "200" ] && [ "$catalog_code" = "200" ] && [ "$api_valid" = "true" ]; then
              "$CHROME" \
                --headless=new \
                --no-sandbox \
                --disable-gpu \
                --disable-dev-shm-usage \
                --hide-scrollbars \
                --virtual-time-budget=8000 \
                --dump-dom \
                "$BASE_URL/catalogo" \
                > "$WORK_DIR/catalog-rendered.html" \
                2> "$WORK_DIR/chrome-render.log" || true

              if grep -Fq 'Soluciones dentales organizadas para consultar con claridad' "$WORK_DIR/catalog-rendered.html" \
                && grep -Fq 'Explora por material o tipo de trabajo' "$WORK_DIR/catalog-rendered.html" \
                && grep -Fq 'Contactar al laboratorio' "$WORK_DIR/catalog-rendered.html" \
                && grep -Fq 'catalog-product-card' "$WORK_DIR/catalog-rendered.html"; then
                dom_valid="true"
                echo 'rendered_dom=ok' | tee -a "$REPORT"
              else
                echo 'rendered_dom=pending' | tee -a "$REPORT"
              fi
            fi

            if [ "$health_code" = "200" ] \
              && [ "$catalog_code" = "200" ] \
              && [ "$api_code" = "200" ] \
              && [ "$api_valid" = "true" ] \
              && [ "$dom_valid" = "true" ]; then
              echo "PUB-UX-2 DEV smoke passed on attempt ${attempt}." | tee -a "$REPORT"
              cat "$REPORT"
              exit 0
            fi

            sleep 6
          done

          echo 'PUB-UX-2 DEV smoke did not pass within the retry window.' | tee -a "$REPORT"
          cat "$REPORT"
          exit 1

      - name: Capture desktop and mobile screenshots
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE_URL="https://dev.laboratoriodentaltlahuac.com/catalogo"
          WORK_DIR="$RUNNER_TEMP/pub-ux-2-smoke"
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --force-device-scale-factor=1 \
            --virtual-time-budget=8000 \
            --window-size=1440,1200 \
            --screenshot="$WORK_DIR/catalog-desktop-1440.png" \
            "$BASE_URL"

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --hide-scrollbars \
            --force-device-scale-factor=1 \
            --virtual-time-budget=8000 \
            --window-size=390,1200 \
            --screenshot="$WORK_DIR/catalog-mobile-390.png" \
            "$BASE_URL"

          test -s "$WORK_DIR/catalog-desktop-1440.png"
          test -s "$WORK_DIR/catalog-mobile-390.png"

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-ux-2-dev-smoke
          path: |
            ${{ runner.temp }}/pub-ux-2-dev-smoke.txt
            ${{ runner.temp }}/pub-ux-2-smoke/health.txt
            ${{ runner.temp }}/pub-ux-2-smoke/catalog.html
            ${{ runner.temp }}/pub-ux-2-smoke/catalog.json
            ${{ runner.temp }}/pub-ux-2-smoke/catalog-rendered.html
            ${{ runner.temp }}/pub-ux-2-smoke/chrome-render.log
            ${{ runner.temp }}/pub-ux-2-smoke/catalog-desktop-1440.png
            ${{ runner.temp }}/pub-ux-2-smoke/catalog-mobile-390.png
          if-no-files-found: warn
          retention-days: 3
