name: Close PUB-UX-2 documentation

on:
  push:
    branches:
      - agent/pub-ux-2-close-docs
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: pub-ux-2-close-docs
  cancel-in-progress: false

jobs:
  close-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    env:
      BRANCH_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}

    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH_NAME }}

      - name: Register PUB-UX-2 technical closure
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # PROJECT_STATUS.md
          status_path = Path('docs/PROJECT_STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          old_state = 'Estado: **implementado en `dev`; validación final del despliegue y pase visual DEV pendientes**.'
          new_state = 'Estado: **CERRADO TÉCNICAMENTE EN DEV**; build, pruebas, smoke HTTP/DOM y revisión visual headless desktop/móvil aprobados. La aceptación visual humana final del responsable queda pendiente.'
          if old_state not in status and new_state not in status:
              raise SystemExit('PROJECT_STATUS PUB-UX-2 state marker not found.')
          status = status.replace(old_state, new_state, 1)

          old_catalog_prefix = '- Catálogo: rediseñado visualmente con carrusel custom de secciones'
          new_catalog_line = (
              '- Catálogo: PUB-UX-2 cerrado técnicamente en DEV como workspace controlado por el usuario, '
              'con sidebar en escritorio, navegación horizontal en tablet, selector nativo y tarjetas compactas en móvil; '
              'sin autoplay ni galería duplicada. Mantiene API administrable, fallback local, imágenes persistentes, '
              'precios MXN y enlaces compartibles por `key`. Smoke DEV: `/health`, `/catalogo` y `/api/catalog/public` '
              'en `200`, 12 categorías, 41 productos y DOM lazy-loaded validado.'
          )
          status_lines = status.splitlines()
          for index, line in enumerate(status_lines):
              if line.startswith(old_catalog_prefix):
                  status_lines[index] = new_catalog_line
                  break
          else:
              if new_catalog_line not in status:
                  raise SystemExit('PROJECT_STATUS catalog summary marker not found.')
          status = '\n'.join(status_lines) + ('\n' if status.endswith('\n') else '')

          evidence_marker = '- Implementación principal integrada mediante PR #1 y ajuste de fidelidad mediante PR #2; la corrección de revisión y documentación se incorpora en el cierre de esta fase.\n'
          evidence_lines = (
              '- `PUB-UX-2.4` se validó en DEV mediante GitHub Actions run `31276207073`: '
              '`/health`, `/catalogo` y `/api/catalog/public` respondieron `200`; la API entregó 12 categorías y 41 productos; '
              'el DOM lazy-loaded mostró los marcadores del nuevo workspace.\n'
              '- Se generaron y revisaron capturas estables de 1440 x 1200 y 390 x 1200 con `prefers-reduced-motion`; '
              'no se detectaron recortes horizontales, problemas de contraste ni bloqueantes responsive.\n'
              '- La primera captura headless atenuada correspondía al frame inicial de la transición `data-animate`; '
              'la ruta de movimiento reducido confirmó el estado visual final y no requirió cambio funcional.\n'
          )
          if '`31276207073`' not in status:
              if evidence_marker not in status:
                  raise SystemExit('PROJECT_STATUS evidence insertion marker not found.')
              status = status.replace(evidence_marker, evidence_marker + evidence_lines, 1)
          status_path.write_text(status, encoding='utf-8')

          # ROADMAP.md
          roadmap_path = Path('docs/ROADMAP.md')
          roadmap = roadmap_path.read_text(encoding='utf-8')
          roadmap_marker = '- Fase sitio 1.6: pulido visual premium del sitio público con CSS/IntersectionObserver, reveal sutil, parallax ligero, microinteracciones y mejoras de composición en home, servicios, catálogo, contacto y login visual. Completada y validada visualmente por el responsable del proyecto.\n'
          roadmap_entry = (
              '- PUB-UX-2: rediseño del catálogo público como workspace responsive. **Cerrado técnicamente en DEV**: '
              'autoplay y galería duplicada eliminados; selección estable por `key`, hash compartible e historial; '
              'descripciones e imágenes administrables conservadas; build/pruebas correctos; smoke DEV `31276207073` '
              'con HTTP `200`, 12 categorías, 41 productos, DOM renderizado y capturas desktop/móvil sin bloqueantes. '
              'Aceptación visual humana final pendiente. Siguiente fase de esta línea: PUB-UX-3 para home, servicios, contacto y encabezado público.\n'
          )
          if 'PUB-UX-2: rediseño del catálogo público como workspace responsive' not in roadmap:
              if roadmap_marker not in roadmap:
                  raise SystemExit('ROADMAP insertion marker not found.')
              roadmap = roadmap.replace(roadmap_marker, roadmap_marker + roadmap_entry, 1)
          roadmap_path.write_text(roadmap, encoding='utf-8')

          # public-website.md
          public_path = Path('docs/01-product/public-website.md')
          public_doc = public_path.read_text(encoding='utf-8')
          public_heading = '## Estado PUB-UX-2 — Workspace Del Catálogo Público\n'
          public_section = """
          ## Estado PUB-UX-2 — Workspace Del Catálogo Público

          Estado: **cerrado técnicamente en DEV; aceptación visual humana final pendiente**.

          Experiencia vigente de `/catalogo`:

          - Una sola categoría activa controlada por el usuario; no existe autoplay ni cambio automático de contenido.
          - Escritorio usa panel lateral; tablet usa navegación horizontal; móvil usa selector nativo y tarjetas compactas horizontales.
          - La selección se identifica por `key`, actualiza `/catalogo#<key>` y funciona con Atrás/Adelante.
          - Enlaces profundos de categorías creadas únicamente desde Admin se conservan mientras carga la API y se resuelven contra la respuesta pública.
          - Se muestran descripciones administrables de sección y producto cuando existen.
          - Una imagen de producto se usa solo para su producto; la imagen de categoría aparece únicamente en el encabezado de esa categoría.
          - Se mantienen `GET /api/catalog/public`, timeout, fallback `catalog-data.ts`, precios MXN, placeholders, imágenes heredadas y `/api/catalog/images/{fileName}`.
          - No se modificaron backend, migraciones, permisos, auth, guards, cookies, XSRF ni el panel administrativo.

          Validación de cierre:

          - Angular build correcto; initial total `321.10 kB`, sin warning de budget.
          - .NET build correcto; Domain 1/1, Application 1/1 y API 158/158.
          - GitHub Actions run `31276207073`: `/health`, `/catalogo` y `/api/catalog/public` en `200`; 12 categorías y 41 productos; DOM lazy-loaded validado.
          - Capturas de 1440 x 1200 y 390 x 1200 revisadas con movimiento reducido; sin scroll horizontal, recortes, contraste insuficiente ni bloqueantes responsive.
          - La captura inicial atenuada fue un frame transitorio de `data-animate` en Chrome headless; el estado estable y `prefers-reduced-motion` quedaron correctos.

          Siguiente fase de rediseño público: `PUB-UX-3`, enfocada en home, servicios, contacto y encabezado público.

          """
          public_marker = '## Audiencia\n'
          if public_heading not in public_doc:
              if public_marker not in public_doc:
                  raise SystemExit('public-website insertion marker not found.')
              public_doc = public_doc.replace(public_marker, public_section + public_marker, 1)
          public_path.write_text(public_doc, encoding='utf-8')

          # IMPLEMENTATION_LOG.md
          log_path = Path('docs/IMPLEMENTATION_LOG.md')
          log = log_path.read_text(encoding='utf-8')
          entry_heading = '## 2026-08-08 - PUB-UX-2 Rediseño Visual Del Catálogo Público\n'
          start = log.find(entry_heading)
          if start < 0:
              raise SystemExit('IMPLEMENTATION_LOG PUB-UX-2 entry not found.')
          next_entry = log.find('\n## 2026-', start + len(entry_heading))
          if next_entry < 0:
              next_entry = len(log)
          entry = log[start:next_entry]

          closure_heading = '### Cierre QA DEV PUB-UX-2.4\n'
          closure_section = """
          ### Cierre QA DEV PUB-UX-2.4

          - Implementación integrada en `dev` mediante PR #1, PR #2 y PR #3; commit funcional final `b34b2509087f6a846fc9a9f06f075ebdfdb4e817`.
          - Validación previa: Angular build correcto con initial total `321.10 kB`; .NET build correcto; Domain 1/1, Application 1/1 y API 158/158; `git diff --check` correcto.
          - Smoke técnico DEV final: GitHub Actions run `31276207073`, resultado `success` en el primer intento.
          - `/health`, `/catalogo` y `/api/catalog/public`: HTTP `200`.
          - Respuesta pública: 12 categorías y 41 productos con estructura válida.
          - Chrome headless confirmó el DOM lazy-loaded con el nuevo hero, selector de categorías, CTA y tarjetas `catalog-product-card`.
          - Se generaron capturas DEV de 1440 x 1200 y 390 x 1200 con `prefers-reduced-motion`; revisión visual sin scroll horizontal, recortes, problemas de contraste ni bloqueantes responsive.
          - Una captura anterior mostró el hero atenuado porque tomó el primer frame de la transición; no era una falla de cascada ni despliegue. La captura estable con movimiento reducido confirmó el estado final esperado.
          - El PR temporal de smoke no fue fusionado y su rama se realineó con `dev` después de conservar la evidencia.

          """
          if closure_heading not in entry:
              marker = '### Estado Y Siguiente Paso\n'
              if marker not in entry:
                  raise SystemExit('IMPLEMENTATION_LOG closure insertion marker not found.')
              entry = entry.replace(marker, closure_section + marker, 1)

          old_tail = (
              '- `PUB-UX-2.1`, `PUB-UX-2.2` y `PUB-UX-2.3`: implementadas.\n'
              '- `PUB-UX-2.4`: pendiente confirmar el workflow de despliegue del commit final, smoke tests de `/health`, `/catalogo` y `/api/catalog/public`, y pase visual humano en DEV.\n'
              '- Después del cierre DEV corresponde iniciar `PUB-UX-3` para home, servicios, contacto y encabezado público.\n'
          )
          new_tail = (
              '- `PUB-UX-2.1`, `PUB-UX-2.2`, `PUB-UX-2.3` y `PUB-UX-2.4`: **cerradas técnicamente en DEV**.\n'
              '- Aceptación visual humana final del responsable: pendiente; no bloquea el cierre técnico ni el funcionamiento publicado.\n'
              '- Siguiente fase: `PUB-UX-3` para home, servicios, contacto y encabezado público.\n'
          )
          if old_tail in entry:
              entry = entry.replace(old_tail, new_tail, 1)
          elif new_tail not in entry:
              raise SystemExit('IMPLEMENTATION_LOG state tail marker not found.')

          log = log[:start] + entry + log[next_entry:]
          log_path.write_text(log, encoding='utf-8')
          PY

      - name: Validate documentation diff
        run: |
          git diff --check
          git diff --stat
          grep -n "PUB-UX-2" docs/PROJECT_STATUS.md docs/ROADMAP.md docs/IMPLEMENTATION_LOG.md docs/01-product/public-website.md

      - name: Commit documentation closure
        shell: bash
        run: |
          git rm .github/workflows/pub-ux-2-close-docs.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close PUB-UX-2 technical validation"
          git push origin "HEAD:${BRANCH_NAME}"
