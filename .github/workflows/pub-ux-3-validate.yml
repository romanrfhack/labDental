name: Validate PUB-UX-3

on:
  push:
    branches:
      - agent/pub-ux-3-public-site
  pull_request:
    branches:
      - dev
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: pub-ux-3-validate-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CONFIGURATION: Release
      WEB_DIR: src/LaboratorioTlahuac.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: src/LaboratorioTlahuac.Web/package-lock.json
      - name: Restore backend
        run: dotnet restore
      - name: Build backend
        run: dotnet build --configuration "$CONFIGURATION" --no-restore
      - name: Test backend
        run: dotnet test --configuration "$CONFIGURATION" --no-build --verbosity normal
      - name: Install frontend dependencies
        run: npm --prefix "$WEB_DIR" ci
      - name: Build frontend
        run: npm --prefix "$WEB_DIR" run build
      - name: Validate diff
        run: git diff --check
