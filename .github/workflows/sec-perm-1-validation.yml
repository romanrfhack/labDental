name: SEC-PERM-1 validation

on:
  push:
    branches:
      - codex/sec-perm-1

permissions:
  contents: write

concurrency:
  group: sec-perm-1-validation
  cancel-in-progress: false

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'
  EF_VERSION: '10.0.7'
  CONFIGURATION: Release
  API_PROJECT: src/LaboratorioTlahuac.Api/LaboratorioTlahuac.Api.csproj
  INFRA_PROJECT: src/LaboratorioTlahuac.Infrastructure/LaboratorioTlahuac.Infrastructure.csproj
  WEB_DIR: src/LaboratorioTlahuac.Web
  DB_CONTEXT: LaboratorioTlahuacDbContext
  MIGRATIONS_DIR: src/LaboratorioTlahuac.Infrastructure/Persistence/Migrations

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WEB_DIR }}/package-lock.json

      - name: Restore backend
        run: dotnet restore

      - name: Build backend
        run: dotnet build --configuration "$CONFIGURATION" --no-restore

      - name: Test backend
        run: dotnet test --configuration "$CONFIGURATION" --no-build --verbosity normal

      - name: Build frontend
        run: |
          npm --prefix "$WEB_DIR" ci
          npm --prefix "$WEB_DIR" run build

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version "$EF_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Verify EF migration
        env:
          ASPNETCORE_ENVIRONMENT: Development
          DOTNET_ENVIRONMENT: Development
          SecuritySeed__EnsureBaselineOnStartup: 'false'
          SecuritySeed__RunOnStartup: 'false'
          SecuritySeed__LimitedQaUser__RunOnStartup: 'false'
          CatalogSeed__RunOnStartup: 'false'
        run: |
          set -euo pipefail
          test -n "$(compgen -G "$MIGRATIONS_DIR/*_AddUserPermissionOverrides.cs" || true)" || { echo "Migration missing"; exit 1; }
          test -n "$(compgen -G "$MIGRATIONS_DIR/*_AddUserPermissionOverrides.Designer.cs" || true)" || { echo "Migration designer missing"; exit 1; }
          dotnet ef migrations has-pending-model-changes \
            --context "$DB_CONTEXT" \
            --project "$INFRA_PROJECT" \
            --startup-project "$API_PROJECT"

      - name: Synchronize canonical documentation
        run: python3 .github/scripts/sec-perm-1-finalize-docs.py

      - name: Commit canonical documentation if needed
        run: |
          set -euo pipefail
          if git diff --quiet -- docs; then
            echo "Canonical documentation already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs(security): finalize SEC-PERM-1 canonical traceability"
          git push origin HEAD:codex/sec-perm-1
